openapi: 3.1.0
info:
  title: Metaspesa REST API
  version: 1.0.0
servers:
  - url: /api/v1
paths:
  /markets/{marketName}/snapshots/{date}:
    post:
      operationId: addMarketSnapshot
      description: >-
        Step 1 transport migration of gRPC AddProducts. Markets are still resolved
        or created by name. Existing batch processing and rollback behavior applies;
        per-item results and raw content are not implemented yet. Prices are in EUR.
      security:
        - ingestionBearer: []
        - sessionCookie: []
      parameters:
        - name: marketName
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - name: date
          in: path
          required: true
          schema:
            type: string
            format: date
          description: Snapshot date in YYYY-MM-DD format, on or after 2023-01-01.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SnapshotRequest"
      responses:
        "204":
          description: Batch processed successfully; no response body
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          description: Missing or invalid authentication
        "403":
          description: ProductManager role required
        "413":
          description: Request body exceeds server limit
        "500":
          $ref: "#/components/responses/Problem"
  /auth/registrations:
    post:
      operationId: registerShopper
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "201":
          description: Shopper account created
        "400":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /auth/sessions:
    post:
      operationId: createBrowserSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "204":
          description: Browser session created
          headers:
            Set-Cookie:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Problem"
  /auth/tokens:
    post:
      operationId: createMachineToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "200":
          description: Product-manager token created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Token"
        "401":
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    ingestionBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: ProductManager token from /auth/tokens.
    sessionCookie:
      type: apiKey
      in: cookie
      name: metaspesa_session
      description: Session token accepted by the default scheme; ProductManager role required.
  schemas:
    SnapshotRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/SnapshotItem"
    SnapshotItem:
      type: object
      required: [name, price, quantity, unitOfMeasure, brandName]
      properties:
        name:
          type: string
          minLength: 1
        price:
          type: number
          minimum: 0
        quantity:
          type: number
          exclusiveMinimum: 0
        unitOfMeasure:
          type: string
          minLength: 1
        brandName:
          type: string
          minLength: 1
        imageUrl:
          type: [string, "null"]
          description: Absolute image URL, empty string, or null.
    Credentials:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
    Token:
      type: object
      additionalProperties: false
      required: [accessToken, tokenType, expiresAt]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          const: Bearer
        expiresAt:
          type: string
          format: date-time
    ProblemDetails:
      type: object
      required: [type, title, status, code, traceId]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        traceId:
          type: string
  responses:
    Problem:
      description: Request failed
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
