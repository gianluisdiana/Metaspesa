version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/client"
    schedule:
      interval: "cron"
      cronjob: "0 5 * * *"
      timezone: "Atlantic/Canary"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      security-fixes:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "uv"
    directory: "/scraper"
    schedule:
      interval: "cron"
      cronjob: "0 5 * * *"
      timezone: "Atlantic/Canary"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      security-fixes:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "nuget"
    directory: "/server"
    schedule:
      interval: "cron"
      cronjob: "0 5 * * *"
      timezone: "Atlantic/Canary"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Atlantic/Canary"
    open-pull-requests-limit: 5

  - package-ecosystem: "docker"
    directories:
      - "/client"
      - "/scraper"
      - "/server/src/GrpcApi"
      - "/server/src/MigrationService"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Atlantic/Canary"
    open-pull-requests-limit: 5

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Atlantic/Canary"
    open-pull-requests-limit: 5
