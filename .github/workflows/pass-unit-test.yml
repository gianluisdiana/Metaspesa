name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  DOTNET_VERSION: "10.0.100"
  NODE_VERSION: "24"
  PYTHON_VERSION: "3.14"

jobs:
  check-backend-format:
    name: Check backend format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Check backend format
        run: dotnet format server/Metaspesa.slnx --verify-no-changes --verbosity diagnostic

  pass-backend-unit-tests:
    name: Pass backend unit tests on ${{matrix.os}}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]

    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Test backend application unit tests
        run: dotnet test server/test/UnitTests/Application.UnitTests/Application.UnitTests.csproj

      - name: Test backend domain unit tests
        run: dotnet test server/test/UnitTests/Domain.UnitTests/Domain.UnitTests.csproj

      - name: Test backend gRPC API unit tests
        run: dotnet test server/test/UnitTests/GrpcApi.UnitTests/GrpcApi.UnitTests.csproj

      - name: Test backend infrastructure unit tests
        run: dotnet test server/test/UnitTests/Infrastructure.UnitTests/Infrastructure.UnitTests.csproj

  pass-backend-integration-tests:
    name: Pass backend integration tests on ${{matrix.os}}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]

    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Test backend database integration tests
        run: dotnet test server/test/IntegrationTests/Database.IntegrationTests/Database.IntegrationTests.csproj -- --explicit on

      - name: Test backend infrastructure integration tests
        run: dotnet test server/test/IntegrationTests/Infrastructure.IntegrationTests/Infrastructure.IntegrationTests.csproj -- --explicit on

  pass-frontend-unit-tests:
    name: Pass frontend unit tests on ${{matrix.os}}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]

    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci
        working-directory: client

      - name: Check frontend lint and format
        run: npm run lint
        working-directory: client

      - name: Test frontend
        run: npm run test
        working-directory: client

  pass-scraper-unit-tests:
    name: Pass scraper unit tests on ${{matrix.os}}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]

    steps:
      - uses: actions/checkout@v4
      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies with uv
        run: uv sync
        working-directory: scraper

      - name: Check scraper lint
        run: uv run ruff check src test
        working-directory: scraper

      - name: Check scraper format
        run: uv run ruff format --check src test
        working-directory: scraper

      - name: Test scraper
        run: uv run pytest
        working-directory: scraper

      - name: Install Playwright browsers and Linux dependencies
        if: runner.os == 'Linux'
        run: uv run playwright install --with-deps firefox
        working-directory: scraper

      - name: Install Playwright browsers
        if: runner.os != 'Linux'
        run: uv run playwright install firefox
        working-directory: scraper

      - name: Test scraper live retailer integrations
        run: uv run pytest -m integration
        working-directory: scraper
