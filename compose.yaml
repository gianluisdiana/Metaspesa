include:
  - path:
      - observability/compose.yaml
      - telemetry/compose.yaml

x-telemetry-environment: &telemetry-environment
  OTEL_EXPORTER_OTLP_ENDPOINT: https://alloy:4317
  OTEL_EXPORTER_OTLP_CERTIFICATE: /run/secrets/telemetry_ca
  OTEL_EXPORTER_OTLP_CLIENT_CERTIFICATE: /run/secrets/telemetry_client_cert
  OTEL_EXPORTER_OTLP_CLIENT_KEY: /run/secrets/telemetry_client_key

x-telemetry-secrets: &telemetry-secrets
  - telemetry_ca
  - telemetry_client_cert
  - telemetry_client_key

services:
  server:
    group_add:
      - "${TELEMETRY_SECRETS_GID:-1999}"
    image: gianluisdiana/metaspesa_rest_api:${METASPESA_VERSION:-latest}
    build:
      context: ./server
      dockerfile: ./src/RestApi/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *telemetry-environment
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      BrowserSecurity__AllowedOrigins__0: http://localhost:3000
      POSTGRES_CONNECTION_STRING: Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    ports:
      - 4001:8080
    env_file:
      - .env
    secrets:
      - jwt_secret_key
      - telemetry_ca
      - telemetry_client_cert
      - telemetry_client_key
    networks:
      - default
      - telemetry

  migrations:
    group_add:
      - "${TELEMETRY_SECRETS_GID:-1999}"
    image: gianluisdiana/metaspesa_migrations:${METASPESA_VERSION:-latest}
    build:
      context: ./server
      dockerfile: ./src/MigrationService/Dockerfile
    profiles:
      - tools
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *telemetry-environment
      POSTGRES_CONNECTION_STRING: Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    secrets: *telemetry-secrets
    env_file:
      - .env
    networks:
      - default
      - telemetry

  client:
    group_add:
      - "${TELEMETRY_SECRETS_GID:-1999}"
    image: gianluisdiana/metaspesa_client:${METASPESA_VERSION:-latest}
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_REST_API_URL: http://localhost:4001/api/v1
    ports:
      - 3000:8080
    depends_on:
      - server
    environment:
      <<: *telemetry-environment
      REST_API_URL: http://server:8080/api/v1
      NEXT_PUBLIC_REST_API_URL: http://localhost:4001/api/v1
      PORT: 8080
    secrets: *telemetry-secrets
    networks:
      - default
      - telemetry

  scraper:
    group_add:
      - "${TELEMETRY_SECRETS_GID:-1999}"
    image: gianluisdiana/metaspesa_scraper:${METASPESA_VERSION:-latest}
    build:
      context: ./scraper
      dockerfile: Dockerfile
    depends_on:
      - server
    environment:
      <<: *telemetry-environment
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      REST_API_URL: http://server:8080/api/v1
    volumes:
      - scraper_data:/app/data
    secrets:
      - scraper_username
      - scraper_password
      - telemetry_ca
      - telemetry_client_cert
      - telemetry_client_key
    networks:
      - default
      - telemetry

  db:
    image: postgres:18.6-alpine
    env_file:
      - .env
    volumes:
      - db_data:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - default
      - telemetry

volumes:
  db_data:
  scraper_data:

secrets:
  jwt_secret_key:
    file: ./secrets/jwt_secret_key
  scraper_username:
    file: ./secrets/scraper_username
  scraper_password:
    file: ./secrets/scraper_password
