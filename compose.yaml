name: ${METASPESA_PROJECT_NAME:-metaspesa}

services:
  server:
    image: gianluisdiana/metaspesa_rest_api:${METASPESA_VERSION:-latest}
    build:
      context: ./server
      dockerfile: ./src/RestApi/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      BrowserSecurity__AllowedOrigins__0: http://localhost:3000
      POSTGRES_CONNECTION_STRING: Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    ports:
      - 4001:8080
    env_file:
      - .env
    secrets:
      - jwt_secret_key

  migrations:
    image: gianluisdiana/metaspesa_migrations:${METASPESA_VERSION:-latest}
    build:
      context: ./server
      dockerfile: ./src/MigrationService/Dockerfile
    profiles:
      - tools
    depends_on:
      db:
        condition: service_healthy
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
      POSTGRES_CONNECTION_STRING: Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    env_file:
      - .env

  client:
    image: gianluisdiana/metaspesa_client:${METASPESA_VERSION:-latest}
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_REST_API_URL: http://localhost:4001/api/v1
    ports:
      - 3000:8080
    depends_on:
      - server
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
      REST_API_URL: http://server:8080/api/v1
      NEXT_PUBLIC_REST_API_URL: http://localhost:4001/api/v1
      PORT: 8080

  scraper:
    image: gianluisdiana/metaspesa_scraper:${METASPESA_VERSION:-latest}
    build:
      context: ./scraper
      dockerfile: Dockerfile
    depends_on:
      - server
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      REST_API_URL: http://server:8080/api/v1
    volumes:
      - scraper_data:/app/data
    secrets:
      - scraper_username
      - scraper_password

  db:
    image: postgres:18.6-alpine
    env_file:
      - .env
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data:
  scraper_data:

secrets:
  jwt_secret_key:
    file: ./secrets/jwt_secret_key
  scraper_username:
    file: ./secrets/scraper_username
  scraper_password:
    file: ./secrets/scraper_password
