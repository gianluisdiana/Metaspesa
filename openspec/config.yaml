schema: spec-driven

context: |
  Project: Metaspesa, a shopping list manager with market price tracking.

  Repository shape:
  - client/: Next.js/React frontend. It communicates with the backend through gRPC adapters.
  - server/: .NET 10 gRPC backend. Projects are Domain, Application, Database, Infrastructure, GrpcApi, MigrationService, and ServiceDefaults.
  - scraper/: Python 3.14 background worker that scrapes supermarkets.
  - db/: PostgreSQL setup.
  - docs/: diagrams and schema notes.
  - observability/: Grafana, Loki, Mimir, Tempo, and Alloy OpenTelemetry collector.
  - compose.yaml and compose.observability.yaml orchestrate local services.

  Architecture rules:
  - Preserve service boundaries. Do not move behavior across client, server, scraper, db, or observability without explicit rationale.
  - Server dependencies flow inward: GrpcApi -> Application -> Domain. Database implements Application abstractions.
  - Domain contains entities and value objects with no external dependencies.
  - Application contains use cases, handlers, DTOs, validators, and abstractions.
  - Database contains EF Core repositories and PostgreSQL persistence.
  - GrpcApi contains transport mapping, .proto files, service implementations, and entry point.
  - Scraper market-specific behavior belongs under scraper/src/infrastructure/market_scrapers/.
  - Client route components belong in client/src/app. View models and services belong in client/src/lib. gRPC infrastructure belongs in client/src/infrastructure.

  Core backend patterns:
  - Use Result<T> for domain/application errors. Handlers should not throw for expected domain failures.
  - Use IClock for time in Domain and Application. Do not use DateTime.Now or DateTime.UtcNow directly there.
  - Use CancellableCommandHandler<TCommand> for use cases that need rollback support.
  - Use IHandler<TCommand, TResult> for application handlers.
  - Keep gRPC response/status mapping in GrpcApi, not Domain or Application.

  gRPC contract:
  - Server proto source lives in server/src/GrpcApi/Protos/.
  - Client proto source lives in client/src/infrastructure/protos/.
  - If proto files change, call out the contract change and regenerate frontend TypeScript types with client npm run generate-proto.
  - Generated TypeScript files land in client/src/infrastructure/protos_generated/.

  Observability:
  - Services emit OpenTelemetry traces, metrics, and logs to http://alloy:4317.
  - Prefer structured logs/attributes over free-form error strings.
  - Never log JWTs, credentials, Docker secrets, request metadata containing auth, or raw sensitive user input.

  Coding conventions:
  - Prefer clarity and existing local patterns over new abstractions.
  - Keep changes scoped to the layer and behavior requested.
  - C# uses nullable references, implicit usings, latest analysis, and warnings as errors.
  - TypeScript follows Next.js, ESLint, and Prettier conventions. React components use PascalCase; functions and variables use camelCase.
  - Python uses Ruff, 88-character lines, double quotes, space indentation, and modern Python 3.14 syntax.
  - Generated scraper gRPC files under scraper/src/infrastructure/grpc/protos are excluded from Ruff checks.
  - Avoid OS-specific assumptions because CI runs on Ubuntu, Windows, and macOS.

  Testing expectations:
  - Add focused tests for changed behavior at the nearest useful layer.
  - Server tests live under server/test/UnitTests and server/test/IntegrationTests.
  - Client tests live under client/test and use *.test.ts or *.test.tsx.
  - Scraper tests live under scraper/test and use test_*.py.
  - Prefer unit tests for domain/application/view-model/processor behavior, integration tests for persistence and cross-boundary behavior.

  Common verification commands:
  - Server: dotnet build server/Metaspesa.slnx; dotnet test server/Metaspesa.slnx.
  - Client: cd client && pnpm run lint; pnpm run typecheck; pnpm run test; pnpm run build when relevant.
  - Scraper: cd scraper && uv run ruff check src test; uv run ruff format --check src test; uv run pytest.
  - Full stack: docker compose up --build when behavior requires cross-service verification.

  Change management:
  - Use Conventional Commits style when describing commits or PRs.
  - Proposals should describe behavior and impact, not implementation trivia.
  - Call out config, migration, observability, proto, or generated-file changes explicitly.
  - Treat files under secrets/ and local .env values as private; never ask to commit real secrets.

rules:
  proposal:
    - State the user-visible problem and desired behavior before naming implementation.
    - Include explicit scope and non-goals for multi-service or cross-layer changes.
    - List affected services, modules, contracts, config, generated files, migrations, and observability surfaces.
    - Identify security, privacy, data integrity, and backward-compatibility impact.
    - Call out whether gRPC contracts, database schema, Docker/Compose, or telemetry configuration change.
    - Keep proposals concise enough to review quickly; prefer concrete bullets over broad narrative.

  specs:
    - Use SHALL language for normative requirements.
    - Write scenarios in WHEN/THEN form with stable, observable outcomes.
    - Separate success, failure, empty-state, permission/auth, validation, and rollback scenarios when relevant.
    - Specify boundary behavior for client, gRPC API, application handlers, persistence, scraper, and telemetry when touched.
    - Avoid prescribing implementation details unless they are part of the required external behavior.
    - Include privacy/security requirements when data, auth, logs, metrics, traces, or secrets are involved.

  design:
    - Start from existing architecture and explain where each responsibility belongs.
    - Reference concrete files, projects, handlers, adapters, services, or scrapers likely to change.
    - Explain data flow across boundaries for cross-service changes, especially client -> gRPC -> application -> database.
    - Include error handling, cancellation, rollback, idempotency, and retry behavior where relevant.
    - Include migration and rollout notes for database, proto, config, or generated-code changes.
    - Include observability design; logs, metrics, traces, attributes, and sensitive-data exclusions.
    - Record alternatives considered when choosing between layers, APIs, or persistence strategies.

  tasks:
    - Break work into small, reviewable tasks grouped by service or layer.
    - Put contract, schema, or generated-code updates before implementation tasks that depend on them.
    - Include focused test tasks beside the behavior they verify, not only at the end.
    - Include verification commands for the changed services.
    - Use checkboxes and update them as implementation progresses.
    - Include documentation, config, migration, or observability follow-up tasks when applicable.
