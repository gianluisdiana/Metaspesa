server:
  http_listen_port: 3200
  tls_min_version: VersionTLS12
  http_tls_config:
    cert_file: /run/secrets/telemetry_server_cert
    key_file: /run/secrets/telemetry_server_key
    client_auth_type: RequireAndVerifyClientCert
    client_ca_file: /run/secrets/telemetry_ca

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
          tls:
            cert_file: /run/secrets/telemetry_server_cert
            key_file: /run/secrets/telemetry_server_key
            client_ca_file: /run/secrets/telemetry_ca
            min_version: "1.2"

backend_scheduler:
  provider:
    compaction:
      compaction:
        block_retention: 48h

backend_worker:
  compaction:
    block_retention: 48h

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal
