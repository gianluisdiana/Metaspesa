groups:
  - name: metaspesa-http
    interval: 1m
    rules:
      - record: metaspesa:http_server_request_rate:rate5m
        expr: sum by (service_name) (rate(http_server_request_duration_seconds_count[5m]))
      - record: metaspesa:http_server_error_rate:ratio5m
        expr: sum(rate(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[5m])) / clamp_min(sum(rate(http_server_request_duration_seconds_count[5m])), 1e-9)
      - record: metaspesa:http_server_duration:p95_5m
        expr: histogram_quantile(0.95, sum by (le, service_name) (rate(http_server_request_duration_seconds_bucket[5m])))
