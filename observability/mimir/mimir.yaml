multitenancy_enabled: false

server:
  http_listen_port: 8080
  grpc_listen_port: 9095
  tls_min_version: VersionTLS12
  http_tls_config:
    cert_file: /run/secrets/telemetry_server_cert
    key_file: /run/secrets/telemetry_server_key
    client_auth_type: RequireAndVerifyClientCert
    client_ca_file: /run/secrets/telemetry_ca

blocks_storage:
  backend: filesystem
  filesystem:
    dir: /var/mimir/blocks
  bucket_store:
    sync_dir: /var/mimir/tsdb-sync

compactor:
  data_dir: /var/mimir/compactor

ruler_storage:
  backend: local
  local:
    directory: /etc/mimir/rules

limits:
  otel_metric_suffixes_enabled: true
  promote_otel_resource_attributes: service.name
  compactor_blocks_retention_period: 72h

ingester:
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory
    replication_factor: 1
